name: Release

# On every push to main, semantic-release reads the commit messages since the
# last tag (Conventional Commits: feat:, fix:, feat!:) and, when one calls for
# it, sets the version in .claude-plugin/plugin.json, updates CHANGELOG.md,
# tags vX.Y.Z and publishes a GitHub Release. Configuration: .releaserc.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the release commit and tag, create the release
  issues: write # comment on issues a release fixes
  pull-requests: write # comment on pull requests a release includes

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false

      - name: Semantic release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        with:
          semantic_version: 24.2.9
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/exec@6.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
