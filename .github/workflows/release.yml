name: Release

# On every push to main, semantic-release reads the commit messages since the
# last tag (Conventional Commits: feat:, fix:, feat!:) and, when one calls for
# it, sets the version in .claude-plugin/plugin.json, updates CHANGELOG.md,
# tags vX.Y.Z and publishes a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the release commit and tag, create the release
  issues: write # comment on issues a release fixes
  pull-requests: write # comment on pull requests a release includes

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate the plugin manifest
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24.2.9
          -p @semantic-release/changelog@6.0.3
          -p @semantic-release/git@10.0.1
          -p @semantic-release/exec@6.0.3
          semantic-release
